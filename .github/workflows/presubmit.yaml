name: presubmit
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Check Agent Skills Documentation
  check-skills-docs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Run documentation checks
        run: |
          (cd flutter && ./tool/check_agent_skills.sh)
          (cd dart && ./tool/check_agent_skills.sh)

  # ==========================================
  # Flutter Plugin Presubmit Jobs
  # ==========================================
  flutter-presubmit:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: build
        run: ./tool/github.sh
        working-directory: flutter

  flutter-checker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        bot: [CHECK_BOT, DART_BOT, UNIT_TEST_BOT, VERIFY_BOT]
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Linux ${{ matrix.bot }}
        run: ./tool/github.sh
        working-directory: flutter
        env:
          BOT: ${{ matrix.bot }}
      - name: upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flutter-build-${{ matrix.bot }}
          path: |
            flutter/**/build/reports/
            flutter/**/build/test-results/
          if-no-files-found: ignore

  # ==========================================
  # Dart Plugin Presubmit Jobs
  # ==========================================
  dart-build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build Plugin Action
        run: ./gradlew buildPlugin
        working-directory: dart/third_party

  dart-unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Provision Dart SDK
        run: ../tool/provision_dart.sh
        working-directory: dart/third_party
        shell: bash

      - name: Unit Test Action
        run: |
          export DART_HOME="$GITHUB_WORKSPACE/dart-sdk"
          ./gradlew :test --tests "com.jetbrains.lang.dart.*"
        working-directory: dart/third_party
        shell: bash

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dart-test-results-${{ matrix.os }}
          path: |
            dart/**/build/reports/
            dart/**/build/test-results/
          if-no-files-found: ignore

  dart-verify-plugin:
    strategy:
      matrix:
        os: [ ubuntu-large ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Free up disk space (on ubuntu only)
        if: ${{ matrix.os == 'ubuntu-large' }}
        run: |
          echo "Freeing disk space..."
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify Plugin Actions
        run: |
          ./gradlew verifyPlugin
          ./gradlew verifyPluginProjectConfiguration
          ./gradlew verifyPluginSignature
          ./gradlew verifyPluginStructure
        working-directory: dart/third_party

      - name: Upload verifier results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dart-verify-build
          path: |
            dart/**/build/reports/
            dart/**/build/test-results/

      - name: Check baselines
        run: |
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BOLD='\033[1m'
          NC='\033[0m'

          EXIT_STATUS=0
          for version in 253 261 262; do
            echo -e "${BOLD}Checking baseline for $version...${NC}"
            BASELINE="dart/third_party/tool/baseline/$version/verifier-baseline.txt"
            REPORT=$(find dart/third_party/build/reports/pluginVerifier -path "*-$version.*/report.md" | head -n 1)
            echo "Found report: $REPORT"

            if [ -f "$REPORT" ]; then
              echo "Comparing baseline against report in $REPORT"
              grep "^*" "$REPORT" | grep -v "com\.intellij\.platform\.dartlsp" | sort > current_issues.tmp || true

              if [ -f "$BASELINE" ]; then
                NEW_ERRORS=$(comm -13 <(sort "$BASELINE") current_issues.tmp)

                if [ -n "$NEW_ERRORS" ]; then
                  echo -e "${RED}${BOLD}Error: New verification issues found for version $version:${NC}"
                  echo "$NEW_ERRORS"
                  EXIT_STATUS=1
                else
                  echo -e "${GREEN}Verification passed for version $version (no new issues).${NC}"
                fi
              else
                echo -e "${YELLOW}Warning: No baseline file found at $BASELINE. Skipping comparison.${NC}"
              fi
            else
              echo -e "${RED}${BOLD}Error: Report does not exist.${NC}"
              EXIT_STATUS=1
            fi
          done

          if [ $EXIT_STATUS -ne 0 ]; then
            echo -e "${RED}${BOLD}Build failed: New verification issues were detected.${NC}"
            echo -e "${YELLOW}To update the baselines with these new issues, run:${NC}"
            echo -e "${YELLOW}  (cd dart && ./third_party/tool/update_baselines.sh)${NC}"
            echo -e "${YELLOW}from the repository root and commit the changes.${NC}"
            exit 1
          fi  
